    sfx: [[.1, 'pop', { gain: .5 }], ...WM.map((_, i) => [WA(i) + .08, 'pop', { gain: .2, pan: -.4 + i * .11 }]), [.4, 'rise', { dur: .9, gain: .3 }], [.62, 'swell', { dur: .5, gain: .2 }], [.85, 'pop', { gain: .4 }], [1.32, 'chime', { gain: .5 }], [FTAP, 'click', { gain: .75 }], [FTAP + .05, 'sparkle', { gain: .45 }], [FTAP + .1, 'success', { gain: .45 }], [FTAP + .5, 'pop', { gain: .3 }], [3.1, 'chime', { gain: .22 }]],
    mount(el) { capBreak(el, 'Проверь'); },
    update(t, $s) {
      const l = spring((t - .1) / .55); sx($s('#flg'), { s: l, y: Math.sin(t * 3) * .6, r: (1 - l) * -20 });
      $s('#fwm').querySelectorAll('.wl').forEach((e, i) => { const k = spring((t - WA(i)) / .45), hop = Math.max(0, Math.sin(cl((t - FTAP - i * .04) / .3) * Math.PI)) * 1.4;
        e.style.opacity = cl(k * 3); e.style.transform = `translateY(${(1 - k) * 7 - hop}vw) scale(${.3 + .7 * k})`; });
      const d = spring((t - .15) / .55); sx($s('#fds'), { s: d * (1 + .02 * Math.sin(t * 4)) });
      // сова выглядывает из-за таймера; на тап — прыжок и взмах крылом, дальше — покачивание
      const ow = $s('#fow'), up = spring((t - .55) / .5), jump = Math.sin(Math.PI * seg(t, FTAP + .02, FTAP + .5)) * 4.5, land = Math.sin(Math.PI * seg(t, FTAP + .5, FTAP + .72));
      const idle = t > 2.8 ? Math.abs(Math.sin((t - 2.8) * 3.4)) * 1.1 : 0;
      ow.style.opacity = t < .55 ? 0 : 1;
      ow.style.transform = `translateY(${(1 - up) * 26 - jump - idle}vw) scale(${1 + .07 * land},${1 - .09 * land}) rotate(${t > 2.8 ? Math.sin((t - 2.8) * 3.4) * 3 : 0}deg)`;
      const wave = t > FTAP ? (t < FTAP + 1.1 ? -40 + Math.sin(t * 16) * 22 : -12 + Math.sin(t * 6) * 14) : 0;
      ow.querySelector('.wingR').style.transform = `rotate(${wave}deg)`; ow.querySelector('.wingL').style.transform = `rotate(${t > FTAP ? 10 + Math.sin(t * 6 + 1) * 10 : 0}deg)`;
      P.owlLook(ow, t < FTAP + .3 ? 2 : 0, t < FTAP + .3 ? 2.8 : .5, P.blink(t + .9));
      const b = $s('#fbt'), press = t >= FTAP && t < FTAP + .12, bk = spring((t - .8) / .5);
      btn(b, 'white', press); b.style.opacity = cl(bk * 2);
      b.style.transform = `translateY(${press ? 1 : (1 - bk) * 8}vw) scale(${1 + (t > FTAP + .12 ? .035 * Math.sin((t - FTAP - .12) * 6) : 0)})`;
      P.cfUpdate($s('#fcf'), t - .2, 50, 30, 80);
      P.cfUpdate($s('#fcf2'), t - FTAP - .05, 50, 62, 75);
      touch($s('#ftc'), t, [tap1(FTAP, 83, 126)]);
    } },
]});

/* глобальные слои поверх сцен: телефон и таймер */
document.getElementById('stage').insertAdjacentHTML('beforeend', LESSON + TIMER);
const baseSet = window.__setTime;
window.__setTime = (ms) => { baseSet(ms); const t = Math.min(ms / 1000, TOTAL - .001); drawLesson(t); drawTimer(t); };
window.__setTime(0);
</script></body></html>
