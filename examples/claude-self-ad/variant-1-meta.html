<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Claude v1 — мета</title>
<script src="../../references/engine.js"></script><script src="../../references/parts.js"></script>
<style>
.ed{position:absolute;left:5vw;right:5vw;top:13vw;height:72vw;background:#161b22;border-radius:3.4vw;box-shadow:0 4vw 10vw rgba(0,0,0,.5),0 0 0 .25vw #30363d;overflow:hidden}
.edb{height:7vw;background:#1f252d;display:flex;align-items:center;gap:1.4vw;padding:0 3vw;font-size:2.6vw;color:#8b949e}.edb i{width:2vw;height:2vw;border-radius:50%;display:block}
.cd{padding:3.5vw;font:3.3vw/1.6 ui-monospace,Menlo,"DejaVu Sans Mono",monospace;color:#c9d1d9;white-space:pre}
.tg{color:#ff7b72}.tx{color:#a5d6ff}.cm{color:#6e7681}
.pv{position:absolute;left:12vw;right:12vw;top:92vw;height:46vw;background:#f5f0e8;border-radius:4vw;box-shadow:0 3vw 8vw rgba(0,0,0,.5)}
.fr{position:absolute;width:26vw;height:46vw;border-radius:2.4vw;display:flex;align-items:flex-end;padding:2vw;font:2.6vw ui-monospace,monospace;color:#fff;font-weight:700}
</style></head><body><script>
const {seg,eo,pop,set,spring,lerp,cl,type,count}=E;
const SRC=`<div class="scene">
  <h1>Привет, я Claude</h1>
  <p>Эту рекламу написал я</p>
  <spark wave />
</div>`;
const colorize=(s)=>s.replace(/&/g,'&amp;').replace(/<(\/?)(\w+)([^>]*)>/g,(m,a,b,c)=>`<span class="tg">&lt;${a}${b}</span><span class="tx">${c.replace(/"([^"]*)"/g,'"$1"')}</span><span class="tg">&gt;</span>`);
const fcol=['#d97757','#5b6cf0','#10a37f','#e0a100','#d94f9a','#2b9bd6'];
E.run({hl:'#d97757',progress:'bar',scenes:[
 {dur:4.4,bg:'#0e1116',ink:'#e8eef5',cam:[1,1.04],cap:'Эту рекламу *написал я*',capAt:2.6,
  html:`<div class="kick" style="color:#8b949e">Мета</div><div class="ed" id="ed"><div class="edb"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i><span style="margin-left:2vw">ad.html</span></div><div class="cd" id="cd"></div></div>
  <div class="pv" id="pv"><div class="abs" id="h1" style="left:0;right:0;top:6vw;text-align:center;font-size:7.4vw;font-weight:900;color:#1f1a17;letter-spacing:-.02em">Привет, я Claude</div><div class="abs" id="p1" style="left:0;right:0;top:19vw;text-align:center;font-size:4.4vw;font-weight:600;color:#6b5f56">Эту рекламу написал я</div><div class="abs" id="sp" style="left:36vw;top:26vw">${P.spark(16)}</div></div>`,
  update(t,$){ const ed=spring(t/.6); set($('#ed'),{o:cl(ed*2),y:(1-ed)*8}); const n=Math.floor(E.seg(t,.5,2.7)*SRC.length); $('#cd').innerHTML=colorize(SRC.slice(0,n))+'<span style="background:#d97757;color:#d97757">_</span>';
    const pv=spring((t-.3)/.6); set($('#pv'),{o:cl(pv*2),y:(1-pv)*8});
    set($('#h1'),{o:eo(seg(t,1.1,1.5)),y:(1-eo(seg(t,1.1,1.5)))*3}); set($('#p1'),{o:eo(seg(t,1.8,2.2)),y:(1-eo(seg(t,1.8,2.2)))*3}); set($('#sp'),{s:spring((t-2.4)/.5)});
    P.sparkAct($('#sp'),{spin:t*40,dx:Math.sin(t*3)*2,blink:P.blink(t),mood:'smile'}); }},
 {dur:4.2,bg:'#0e1116',ink:'#e8eef5',hl:'#d97757',trans:'wipe',cap:'HTML → кадры → *видео*',capAt:.5,
  html:`<div class="kick" style="color:#8b949e">Рендер</div><div class="abs" style="left:8vw;right:8vw;top:22vw;font-size:4.4vw;font-weight:700;color:#8b949e">Рендер кадров</div>
  <div class="abs" id="cn" style="left:8vw;right:8vw;top:30vw;font-size:17vw;font-weight:900;color:#fff;letter-spacing:-.03em;font-variant-numeric:tabular-nums">0</div>
  <div class="abs" style="left:8vw;right:8vw;top:52vw;height:3vw;border-radius:2vw;background:#21262d;overflow:hidden"><div id="pb" style="height:100%;width:0;background:linear-gradient(90deg,#d97757,#ffb48a)"></div></div>
  <div id="strip" class="abs" style="left:0;top:66vw;width:400vw;height:50vw">${Array.from({length:14},(_,i)=>`<div class="fr" style="left:${i*30}vw;background:${fcol[i%6]}">кадр ${i*171+1}</div>`).join('')}</div>
  <div class="abs" id="fl" style="left:16vw;right:16vw;top:122vw;background:#161b22;border-radius:4vw;box-shadow:0 0 0 .25vw #30363d,0 3vw 8vw rgba(0,0,0,.5);padding:4vw 5vw;display:flex;align-items:center;gap:4vw"><div style="width:12vw;height:12vw;border-radius:3vw;background:#d97757;display:grid;place-items:center">${P.icon('send','#fff',7).replace('rotate','')}</div><div><div style="font-size:4.6vw;font-weight:800;color:#fff">ad.mp4</div><div style="font-size:3.2vw;color:#8b949e">1080×1920 · 60 fps</div></div></div>`,
  update(t,$){ const k=eo(seg(t,.4,3.0)); $('#cn').textContent=count(0,2412,t,.4,3.0).toLocaleString('ru-RU').replace(/ /g,' '); $('#pb').style.width=(k*100)+'%';
    $('#strip').style.transform=`translateX(${-t*22}vw)`; set($('#fl'),{o:cl(spring((t-3.0)/.5)*2),s:.85+.15*spring((t-3.0)/.5)}); }},
 {dur:3.6,bg:'radial-gradient(circle at 50% 42%,#3a2a24,#0e1116 70%)',ink:'#e8eef5',hl:'#d97757',trans:'circle',cap:'Спроси — и *посмотри сам*',capAt:1.4,
  html:`<div class="abs" id="sp" style="left:28vw;top:34vw">${P.spark(44)}</div><div class="abs" id="t" style="left:0;right:0;top:90vw;text-align:center;font-size:22vw;font-weight:900;letter-spacing:-.05em;color:#f5f0e8">Claude</div>`,
  update(t,$){ set($('#sp'),{s:spring(t/.6),y:Math.sin(t*3)*1}); P.sparkAct($('#sp'),{spin:t*30,blink:P.blink(t+.3),mood:'smile'}); const k=spring((t-.3)/.5); set($('#t'),{o:cl(k*3),s:1.3-.3*k}); }}
]});
</script></body></html>
