<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Claude v2 — завал задач</title>
<script src="../../references/engine.js"></script><script src="../../references/parts.js"></script>
<style>
.tk{position:absolute;width:56vw;padding:3.4vw 4.6vw;border-radius:4vw;background:#fff;box-shadow:0 1vw 0 #e0d6c8,0 3vw 8vw rgba(90,60,30,.2);font-size:5.2vw;font-weight:800;color:#1f1a17}
.row{position:absolute;left:7vw;right:7vw;height:36vw;border-radius:5vw;background:#fff;box-shadow:0 1.2vw 0 #e0d6c8,0 4vw 9vw rgba(90,60,30,.16);padding:4vw 5vw;color:#1f1a17}
.row h4{font-size:4.6vw;font-weight:900}.row .st{position:absolute;right:4vw;top:4vw;background:#10a37f;color:#fff;font-size:3.6vw;font-weight:900;padding:1.2vw 3vw;border-radius:3vw}
.df{font:3.3vw/1.5 ui-monospace,Menlo,monospace;margin-top:2.6vw;border-radius:2vw;padding:1.6vw 2.4vw;white-space:pre}
</style></head><body><script>
const {seg,eo,pop,set,spring,lerp,cl,type,count}=E;
const T=[['Отчёт на 40 страниц',8,34,-5],['Баг в проде',34,50,4],['Письмо клиенту',10,66,3],['План на неделю',30,82,-4],['Презентация',6,98,5],['Созвон в 15:00',34,114,-3]];
E.run({hl:'#d97757',progress:'bar',scenes:[
 {dur:4.0,bg:'linear-gradient(170deg,#f8efe3,#f1e4d6)',ink:'#1f1a17',cam:[1,1.04],cap:'Задач много. *Времени* нет.',capAt:2.2,
  html:`<div class="kick" style="color:#1f1a17">Понедельник, 9:00</div><div class="abs" id="cn" style="left:0;right:0;top:14vw;text-align:center;font-size:10vw;font-weight:900;letter-spacing:-.03em">задач: 0</div>`+T.map(x=>`<div class="tk" style="left:${x[1]}vw;top:${x[2]}vw">${x[0]}</div>`).join('')+`<div class="abs" id="sp" style="left:70vw;top:118vw">${P.spark(22)}</div>`,
  update(t,$,p,$$){ $$('.tk').forEach((e,i)=>{const a=.25+i*.38;const k=spring((t-a)/.55);const y=lerp(-60,0,Math.min(1,k));set(e,{o:cl((t-a)*6),y:y,r:T[i][3]*cl(k)})});
    $('#cn').textContent='задач: '+Math.min(6,Math.max(0,Math.floor((t-.25)/.38)+1)); set($('#sp'),{s:spring((t-3.0)/.5),y:0}); P.sparkAct($('#sp'),{spin:t*20,dx:-3,blink:P.blink(t),mood:t>3?'smile':'o'}); }},
 {dur:6.4,bg:'#f5f0e8',ink:'#1f1a17',hl:'#d97757',trans:'circle',cap:'Claude *разбирает* всё по очереди',capAt:.4,
  html:`<div class="kick" style="color:#1f1a17">Одну за другой</div>
  <div class="row" style="top:22vw" id="r1"><h4>Баг в проде</h4><div class="st" id="s1" style="opacity:0">Исправлено</div><div class="df" id="d1" style="background:#ffebe9;color:#a40e26">- total = price + tax</div><div class="df" id="d2" style="background:#dafbe1;color:#116329;margin-top:1vw">+ total = price * (1 + tax)</div></div>
  <div class="row" style="top:62vw" id="r2"><h4>Отчёт на 40 страниц</h4><div class="st" id="s2" style="opacity:0">3 пункта</div><div id="sm" style="font-size:4.2vw;line-height:1.5;margin-top:3vw;font-weight:600"></div></div>
  <div class="row" style="top:102vw" id="r3"><h4>Письмо клиенту</h4><div class="st" id="s3" style="opacity:0">Вежливо</div><div style="margin-top:3vw;font-size:4.2vw;font-weight:600;line-height:1.4"><span id="bd" style="color:#a40e26;text-decoration:line-through">Вы опять сорвали сроки!</span><br><span id="gd" style="color:#116329"></span></div></div>`,
  update(t,$){ ['#r1','#r2','#r3'].forEach((id,i)=>{const k=spring((t-.2-i*.15)/.5);set($(id),{o:cl(k*2),y:(1-k)*8})});
    set($('#d1'),{o:eo(seg(t,.7,1.0))}); set($('#d2'),{o:eo(seg(t,1.3,1.6))}); set($('#s1'),{o:cl(spring((t-1.9)/.4)*2),s:spring((t-1.9)/.4)});
    const L=['1. Оплата — 30 дней','2. Штраф — 0,1% в день','3. Выход — за 14 дней'];$('#sm').innerHTML=L.map((x,i)=>`<div style="opacity:${eo(seg(t,2.6+i*.35,2.9+i*.35))}">${x}</div>`).join(''); set($('#s2'),{o:cl(spring((t-3.9)/.4)*2),s:spring((t-3.9)/.4)});
    $('#gd').textContent=type('Давайте уточним новые сроки — нам важно успеть.',t,4.7,5.8); set($('#s3'),{o:cl(spring((t-5.7)/.4)*2),s:spring((t-5.7)/.4)}); }},
 {dur:2.8,bg:'#d97757',ink:'#fff',hl:'#1f1a17',trans:'circle',cap:'Что сделаем *вместе*?',capAt:1.0,
  html:`<div class="abs" id="sp" style="left:30vw;top:36vw">${P.spark(40,'#fff','#d97757')}</div><div class="abs" id="t" style="left:0;right:0;top:92vw;text-align:center;font-size:20vw;font-weight:900;letter-spacing:-.05em;color:#fff">Claude</div>`,
  update(t,$){ set($('#sp'),{s:spring(t/.6)}); P.sparkAct($('#sp'),{spin:t*40,blink:P.blink(t),mood:'smile'}); const k=spring((t-.3)/.5); set($('#t'),{o:cl(k*3),s:1.3-.3*k}); }}
]});
</script></body></html>
